<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="tienda online de velas de soja artesanales genova.">

    <title>genova | velas de soja</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>

<body>
    <header class="encabezado">
        <h1>Genova Velas de Soja</h1>
        <p>velas de soja artesanales</p>
    </header>

    <main class="contenedor-principal">
        <section class="seccion-catalogo">
            <h2>catalogo de productos</h2>

            <input type="text" id="busqueda" placeholder="buscar una vela..." aria-label="buscar una vela">

            <div id="catalogoProductos" class="catalogo"></div>
        </section>

        <aside class="seccion-carrito">
            <h2>
                carrito
                <span id="cantidadCarrito">(0)</span>
            </h2>

            <ul id="carritoProductos" class="lista-carrito"></ul>

            <p class="total">
                total: <span id="total">$0</span>
            </p>

            <div class="acciones-carrito">
                <button type="button" id="btnVaciar">
                    vaciar carrito
                </button>

                <button type="button" id="btnFinalizar">
                    finalizar compra
                </button>
            </div>

            <p id="feedback" class="feedback" aria-live="polite"></p>
        </aside>
    </main>
</body>

</html>
